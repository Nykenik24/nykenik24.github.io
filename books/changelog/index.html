<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal compendium in four volumes.">

  <title>Credits &amp; changelog · Andrei&#39;s Compendium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap"
  >
  <link rel="stylesheet" href="/assets/css/main.css">

  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <script src="/assets/js/main.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <button
  class="lamp"
  type="button"
  aria-label="Turn the light on"
  aria-pressed="false"
>
  <span class="lamp-cord"></span>
  <span class="lamp-bulb"></span>
  <span class="lamp-shade"></span>
</button>

  
<main class="page">
  <div class="shelf-wrap" inert>
    <p class="wordmark">Andrei&#39;s Compendium</p>
    <div class="shelf">
  <div class="books">
    
    <a
      class="spine"
      href="/books/about/"
      style="--w: 18; --band: #7a2e26"
    >
      <span class="spine-num">I</span>
      <span class="spine-title">About</span>
    </a>
    
    <a
      class="spine"
      href="/books/projects/"
      style="--w: 23; --band: #22405b"
    >
      <span class="spine-num">II</span>
      <span class="spine-title">Projects</span>
    </a>
    
    <a
      class="spine"
      href="/books/journal/"
      style="--w: 29; --band: #2e4a3a"
    >
      <span class="spine-num">III</span>
      <span class="spine-title">Journal</span>
    </a>
    
    <a
      class="spine"
      href="/books/changelog/"
      style="--w: 12; --band: #96692e"
    >
      <span class="spine-num">IV</span>
      <span class="spine-title">Credits &amp; changelog</span>
    </a>
    

    <img
      class="shelf-plant"
      src="/assets/images/plant.png"
      alt=""
      aria-hidden="true"
    />
  </div>

  <div class="plank" aria-hidden="true"></div>
</div>

  </div>
</main>

<div class="cover-view">
  <button
    class="book"
    type="button"
    aria-label="Show summary"
    style="--band: #96692e"
  >
    <span class="face front">
      <span class="band"><span class="numeral">IV</span></span>
      <span class="front-main">
        <span class="front-title">Credits &amp; changelog</span>
        <span
          class="cover-art"
          style="--art: url('/assets/covers/changelog.svg')"
        ></span>
      </span>
    </span>

    <span class="face back">
      <span class="back-num">IV</span>
      <span class="back-text">Changelog, what fonts I used, resources and inspiration.</span>
    </span>
  </button>

  <button class="open-btn" type="button">Open</button>
</div>

<dialog class="reader">
  <div class="leaf" tabindex="-1" style="--band: #96692e">
    <header class="leaf-head">
      <button class="leaf-close" type="button" aria-label="Close book">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
    </header>

    <div class="leaf-body">
      <button
        class="index-return"
        type="button"
        aria-label="Back to contents"
        title="Back to contents"
        hidden
      ></button>

      <div class="leaf-page">
        <div class="flow"><h2 id="fonts" tabindex="-1"><a class="header-anchor" href="#fonts">Fonts</a></h2>
<ul>
<li>Main font: <a href="https://fonts.google.com/specimen/Poltawski+Nowy">Półtawski Nowy</a>.</li>
<li>Monospaced font: <a href="https://fonts.google.com/specimen/Space+Mono">Space Mono</a>.</li>
</ul>
<h2 id="stack" tabindex="-1"><a class="header-anchor" href="#stack">Stack</a></h2>
<p>Built statically through <a href="https://www.11ty.dev/">eleventy</a>.</p>
<h2 id="inspiration" tabindex="-1"><a class="header-anchor" href="#inspiration">Inspiration</a></h2>
<p><a href="https://www.akoder.xyz/">Aditya Ojha</a> inspired me to revamp my portfolio in the first place.</p>
</div>
      </div>
    </div>

    <footer class="leaf-foot">
      <button class="page-btn prev" type="button" aria-label="Previous page">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M10 3L5 8l5 5" />
        </svg>
      </button>
      <span class="page-count"></span>
      <button class="page-btn next" type="button" aria-label="Next page">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 3l5 5-5 5" />
        </svg>
      </button>
    </footer>
  </div>

  <button
  class="lamp"
  type="button"
  aria-label="Turn the light on"
  aria-pressed="false"
>
  <span class="lamp-cord"></span>
  <span class="lamp-bulb"></span>
  <span class="lamp-shade"></span>
</button>

</dialog>


</body>
</html>
