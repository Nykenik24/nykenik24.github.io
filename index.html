<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal compendium in five volumes.">

  <title>Andrei&#39;s Compendium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap"
  >
  <link rel="stylesheet" href="/assets/css/main.css">

  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <script src="/assets/js/main.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <button
  class="lamp"
  type="button"
  aria-label="Turn the light on"
  aria-pressed="false"
>
  <span class="lamp-cord"></span>
  <span class="lamp-bulb"></span>
  <span class="lamp-shade"></span>
</button>

  
<main class="page">
  <div class="shelf-wrap">
    <h1 class="wordmark">Andrei&#39;s Compendium</h1>
    <div class="shelf">
  <div class="books">
    
    <a
      class="spine"
      href="/books/about/"
      style="--w: 18; --band: #7a2e26"
    >
      <span class="spine-num">I</span>
      <span class="spine-title">About</span>
    </a>
    
    <a
      class="spine"
      href="/books/projects/"
      style="--w: 23; --band: #22405b"
    >
      <span class="spine-num">II</span>
      <span class="spine-title">Projects</span>
    </a>
    
    <a
      class="spine"
      href="/books/journal/"
      style="--w: 29; --band: #2e4a3a"
    >
      <span class="spine-num">III</span>
      <span class="spine-title">Journal</span>
    </a>
    
    <a
      class="spine"
      href="/books/changelog/"
      style="--w: 12; --band: #96692e"
    >
      <span class="spine-num">V</span>
      <span class="spine-title">Credits &amp; changelog</span>
    </a>
    

    <img
      class="shelf-plant"
      src="/assets/images/plant.png"
      alt=""
      aria-hidden="true"
    />
  </div>

  <div class="plank" aria-hidden="true"></div>
</div>

  </div>
</main>

</body>
</html>
